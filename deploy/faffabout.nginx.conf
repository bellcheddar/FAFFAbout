# faffabout.mdeller.com
#
# Install:
#   sudo cp deploy/faffabout.nginx.conf /etc/nginx/sites-available/faffabout
#   sudo ln -s /etc/nginx/sites-available/faffabout /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d faffabout.mdeller.com      # mdeller.com's cert does NOT cover subdomains
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two things this box gets wrong if you copy another vhost carelessly:
#
#   1. nginx here is 1.24, so http2 goes ON THE LISTEN LINE: `listen 443 ssl http2;`.
#      The `http2 on;` form arrived in 1.25.1 and fails `nginx -t` with "unknown
#      directive", after which nginx refuses the reload and keeps serving the OLD config.
#      The site stays up and the change silently does not apply. Check an existing vhost
#      with: grep -h "listen 443" /etc/nginx/sites-available/*
#
#   2. `add_header` in a location block REPLACES the ones set outside it rather than
#      merging, so Cache-Control is set in every location that needs it.
#
# Do NOT add a `types { }` block here: one in a vhost replaces the whole MIME map and
# everything is served as application/octet-stream, which still returns 200.

server {
    listen 80;
    listen [::]:80;
    server_name faffabout.mdeller.com;
    return 301 https://$host$request_uri;
}

server {
    # certbot writes `listen 443 ssl;` here; add http2 to THIS line, not as its own directive
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faffabout.mdeller.com;

    # ssl_certificate lines are managed by certbot

    access_log /var/log/nginx/faffabout.access.log;
    error_log  /var/log/nginx/faffabout.error.log;

    # A forecast runs an MMseqs2 search and eight boosters, and may call a local model for
    # the narrative. Well under a second in practice, but do not let a cold start 504.
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    client_max_body_size  1m;          # a sequence, not an upload

    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The page itself must never be held by a cache, or a deploy stays invisible
        # behind heuristic caching for returning visitors.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # The launcher counts visits by watching for a sub-resource only a rendering browser
    # fetches. A single-page app with CDN libraries requests nothing local, so the favicon
    # is the beacon: give it a SHORT max-age or the counter reads a fraction of real
    # traffic.
    location = /static/icon.svg {
        proxy_pass http://127.0.0.1:8009/static/icon.svg;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8009/static/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Readiness, for monitoring. Never cached.
    location = /healthz {
        proxy_pass http://127.0.0.1:8009/healthz;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
}
