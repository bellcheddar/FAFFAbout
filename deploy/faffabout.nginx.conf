# faffabout.mdeller.com
#
# Installed by deploy/provision.sh as /etc/nginx/sites-available/faffabout, then converted
# to HTTPS by `certbot --nginx -d faffabout.mdeller.com --redirect`, the same way every
# other site on the droplet was set up. It starts as a plain port-80 server because a
# `listen 443 ssl` block with no certificate fails `nginx -t`, and nginx then keeps serving
# the OLD config: the change silently does not apply.
#
# After certbot, provision.sh adds http2 to certbot's listen lines. nginx here is 1.24, so
# http2 goes ON THE LISTEN LINE (`listen 443 ssl http2;`); the `http2 on;` form arrived in
# 1.25.1 and fails `nginx -t` with "unknown directive".
#
# `add_header` in a location block REPLACES the ones set outside it rather than merging, so
# Cache-Control is set in every location that needs it. Do NOT add a `types { }` block: one
# in a vhost replaces the whole MIME map and everything is served as octet-stream.

server {
    listen 80;
    listen [::]:80;
    server_name faffabout.mdeller.com;

    access_log /var/log/nginx/faffabout.access.log;
    error_log  /var/log/nginx/faffabout.error.log;

    # A forecast runs an MMseqs2 search, eight boosters and a DuckDB read of the relatives'
    # trials: about a second warm, longer on a cold index. Do not let a cold start 504.
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    client_max_body_size  1m;          # a sequence, not an upload

    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The page itself must never be held by a cache, or a deploy stays invisible
        # behind heuristic caching for returning visitors.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # The launcher counts visits by watching for a sub-resource only a rendering browser
    # fetches; the favicon is the beacon, so give it a SHORT max-age.
    location = /static/icon.svg {
        proxy_pass http://127.0.0.1:8012/static/icon.svg;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8012/static/;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Readiness, for monitoring. Never cached.
    location = /healthz {
        proxy_pass http://127.0.0.1:8012/healthz;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
}
